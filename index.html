<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-слот</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .slot-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #ffd700;
        }

        /* «Окошко» барабана, через которое видно слово */
        .reel-window {
            width: 180px;
            height: 60px;
            background: #fff;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin: 20px auto;
            overflow: hidden;
            border: 3px inset #555;
        }

        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ffc400;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        #result {
            margin-top: 15px;
            font-size: 16px;
            height: 20px;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="slot-container">
        <h2>Простой слот</h2>
        
        <!-- Окно барабана -->
        <div class="reel-window">
            <span id="reel">СТАРТ</span>
        </div>

        <button id="spinBtn" onclick="startSpin()">КРУТИТЬ</button>
        <div id="result"></div>
    </div>

    <script>
        // Возможные «слова» (символы) на барабане
        const symbols = ["ЛИМОН", "ВИШНЯ", "СЕМЕРКА", "БАР", "АПЕЛЬСИН"];
        
        const reel = document.getElementById("reel");
        const spinBtn = document.getElementById("spinBtn");
        const resultDiv = document.getElementById("result");

        function startSpin() {
            // Блокируем кнопку на время вращения
            spinBtn.disabled = true;
            resultDiv.textContent = "";

            let counter = 0;
            // Определяем, сколько «шагов» сделает анимация перед остановкой
            const totalSteps = 20; 

            // Запускаем быстрое переключение слов (эффект крутящегося барабана)
            const spinInterval = setInterval(() => {
                // Выбираем случайное слово из массива
                const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                reel.textContent = randomSymbol;
                counter++;

                // Когда шаги заканчиваются, останавливаем таймер
                if (counter >= totalSteps) {
                    clearInterval(spinInterval);
                    
                    // Выбираем финальное слово (в реальном казино это решает ГСЧ)
                    const finalSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    reel.textContent = finalSymbol;

                    // Проверяем результат (самый простой пример: выпала СЕМЕРКА — победа)
                    if (finalSymbol === "СЕМЕРКА") {
                        resultDiv.textContent = "ДЖЕКПОТ! Вы выиграли!";
                    } else {
                        resultDiv.textContent = "Попробуйте еще раз!";
                    }
                    // Возвращаем активность кнопке
                    spinBtn.disabled = false;
                }
            }, 75); // Скорость смены слов в миллисекундах (чем меньше, тем быстрее «крутится»)
        }
    </script>

</body>
</html>
