<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированный слот</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .slot-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #ffd700;
        }

        /* «Окошко» барабана, скрывающее всё, что за его пределами */
        .reel-window {
            width: 180px;
            height: 60px;
            background: #fff;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            margin: 20px auto;
            overflow: hidden; /* Главное: прячем то, что выезжает за границы */
            position: relative;
            border: 3px inset #555;
        }

        /* Лента со всеми символами, которая будет двигаться */
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* Плавный переход для анимации */
            transition: transform 1.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        /* Каждый отдельный символ на ленте (высота должна быть равна высоте окна — 60px) */
        .symbol {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ffc400;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        #result {
            margin-top: 15px;
            font-size: 16px;
            height: 20px;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="slot-container">
        <h2>Анимированный слот</h2>
        
        <!-- Окно барабана -->
        <div class="reel-window">
            <div class="reel-strip" id="reelStrip">
                <!-- Символы дублируются, чтобы лента была длинной для прокрутки -->
                <div class="symbol">ЛИМОН</div>
                <div class="symbol">ВИШНЯ</div>
                <div class="symbol">СЕМЕРКА</div>
                <div class="symbol">БАР</div>
                <div class="symbol">АПЕЛЬСИН</div>
                <div class="symbol">ЛИМОН</div>
                <div class="symbol">ВИШНЯ</div>
                <div class="symbol">СЕМЕРКА</div>
                <div class="symbol">БАР</div>
                <div class="symbol">АПЕЛЬСИН</div>
            </div>
        </div>

        <button id="spinBtn" onclick="spinReel()">КРУТИТЬ</button>
        <div id="result"></div>
    </div>

    <script>
        const reelStrip = document.getElementById("reelStrip");
        const spinBtn = document.getElementById("spinBtn");
        const resultDiv = document.getElementById("result");

        const symbolHeight = 60; // Высота одного блока в пикселях
        const totalSymbols = 5;  // Количество уникальных символов

        function spinResl() { // старт
            // Функция уже вызывается по клику
        }

        spinBtn.addEventListener("click", function() {
            spinBtn.disabled = true;
            resultDiv.textContent = "";

            // 1. Сбрасываем анимацию в исходную точку
            reelStrip.style.transition = "none";
            reelStrip.style.transform = "translateY(0px)";

            setTimeout(function() {
                // 2. Выбираем случайный индекс победного символа (от 0 до 4)
                const winningIndex = Math.floor(Math.random() * totalSymbols);

                // 3. Считаем смещение строго в целых пикселях
                const extraSpins = 5; 
                const targetOffset = -((extraSpins * totalSymbols + winningIndex) * symbolHeight);

                // Возвращаем плавный переход и задаем конечную точку через конкатенацию (без шаблонных строк)
                reelStrip.style.transition = "transform 1.5s cubic-bezier(0.1, 0.7, 0.1, 1)";
                reelStrip.style.transform = "translateY(" + targetOffset + "px)";

                // 4. Ждем окончания анимации (1.5 секунды)
                setTimeout(function() {
                    spinBtn.disabled = false;
                    
                    const symbolsList = ["ЛИМОН", "ВИШНЯ", "СЕМЕРКА", "БАР", "АПЕЛЬСИН"];
                    const finalSymbol = symbolsList[winningIndex];

                    if (finalSymbol === "СЕМЕРКА") {
                        resultDiv.textContent = "ДЖЕКПОТ! Вы выиграли!";
                    } else {
                        resultDiv.textContent = "Выпало: " + finalSymbol + ". Попробуйте еще!";
                    }
                }, 1500);

            }, 50);
        });
    </script>

</body>
</html>
